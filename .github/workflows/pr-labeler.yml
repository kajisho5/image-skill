name: PR Labeler

# pull_request_target (not pull_request) so a fork's PR still gets labeled:
# it runs with the base repo's token/permissions instead of the fork's. No
# checkout step is used, so no fork code ever executes here - the action
# only calls the GitHub API (PR title/changed files) to decide labels.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      # disable-releaser is a real release-drafter v6 input (unlike `dry-run`, which v6
      # does not have): this job only applies labels and never touches draft releases.
      # Versions are resolved by .github/scripts/resolve_version.py from these labels.
      - name: Autolabel from title/files (release-drafter.yml rules)
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
