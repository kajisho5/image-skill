name: PR Labeler

# pull_request_target (not pull_request) so a fork's PR still gets labeled:
# it runs with the base repo's token/permissions instead of the fork's. No
# checkout step is used, so no fork code ever executes here - the action
# only calls the GitHub API (PR title/changed files) to decide labels.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      # No dry-run/disable flag here: on a pull_request_target event
      # release-drafter only runs its autolabeler logic (there's no push-to-
      # main context to draft a release for), so this is already a real
      # label-writing run and should be, since labeling is the entire point.
      - name: Autolabel from title/files (release-drafter.yml rules)
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
