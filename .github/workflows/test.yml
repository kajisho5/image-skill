name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu-no-magick-binary:
    # Ubuntu's apt "imagemagick" package is IM6 without a `magick` compat
    # command (only convert/identify/mogrify/...), so this job exercises the
    # "no magick" code paths: doctor's no-backend reporting, and every test
    # that isn't gated on a backend. It intentionally does NOT install
    # ImageMagick, to keep that signal honest instead of faking a `magick`
    # binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/_contract.py doctor --json
      - run: python3 scripts/_contract.py contract --json
      - name: docs/contract.md matches the contract
        run: python3 .github/scripts/contract_md.py --check

  ubuntu-with-imagemagick:
    # apt's ImageMagick 6 gives real convert/identify/compare/montage binaries;
    # a small `magick` shim routes IM7-style calls to them so the magick-backed
    # code paths run in CI. Python 3.9 is the oldest version the skill supports.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Provide a magick compat shim if apt's package lacks one
        run: |
          if ! command -v magick >/dev/null 2>&1; then
            printf '#!/bin/sh\ncase "$1" in identify|compare|montage|composite|convert) c="$1"; shift; exec "$c" "$@";; esac\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version
      - run: python3 -m unittest discover -s tests -v

  macos-sips:
    # macOS ships sips out of the box - this is the only job that actually
    # exercises the sips-only fallback code paths (resize fit box math,
    # convert, probe) for real, including the fit-mode integration test that
    # is always skipped everywhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/_contract.py doctor --json

  macos-imagemagick7:
    # The only job with a real ImageMagick 7 `magick` (Homebrew), rather than the
    # IM6 shim above: IM7-specific output formats and behaviour are checked here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick 7
        run: |
          brew install imagemagick || brew upgrade imagemagick || true
          magick -version
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/_contract.py doctor --json

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node -c bin/install.js
      - name: Exercise every install target in a throwaway HOME
        run: |
          set -e
          export HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$HOME"
          node bin/install.js
          test -f "$HOME/.claude/skills/imagemagick-skill/SKILL.md"
          node bin/install.js --cursor
          test -f "$HOME/.cursor/skills/imagemagick-skill/SKILL.md"
          node bin/install.js --codex
          test -f "$HOME/.agents/skills/imagemagick-skill/SKILL.md"
          node bin/install.js --uninstall
          test ! -d "$HOME/.claude/skills/imagemagick-skill"
          node bin/install.js doctor --json
          node bin/install.js contract --json
      - name: Install from the packed tarball through npx, as a user would
        run: |
          set -e
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/imagemagick-skill-*.tgz)
          export HOME="$RUNNER_TEMP/npx-home"
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          npx --yes --package "$TARBALL" imagemagick-skill
          test -f "$HOME/.claude/skills/imagemagick-skill/scripts/_contract.py"
          npx --yes --package "$TARBALL" imagemagick-skill doctor --json
          python3 "$HOME/.claude/skills/imagemagick-skill/mcp/server.py" --list
          npx --yes --package "$TARBALL" imagemagick-skill --uninstall
          test ! -d "$HOME/.claude/skills/imagemagick-skill"
