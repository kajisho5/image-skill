# Config for release-drafter/release-drafter's AUTOLABELER only (.github/workflows/
# pr-labeler.yml, run with disable-releaser: true). Versions are NOT resolved here:
# .github/scripts/resolve_version.py reads the labels this applies and decides the release
# (feature -> minor, fix -> patch, chore/ci/docs/test/refactor/dependencies -> nothing,
# major/breaking -> refused). Keep the label vocabulary in the two files in step.
#
# `major`/`breaking` are never applied automatically (see #11): a title or body pattern is
# not a decision to break compatibility. A person applies them, and even then
# resolve_version.py refuses - a major release is a hand-made package.json bump.
#
# The other keys (categories, version-resolver, template) are kept only
# because release-drafter validates its config file as a whole; nothing reads their output.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'major'
      - 'breaking'
  - title: '✨ Features'
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'patch'
      - 'chore'
      - 'refactor'
      - 'ci'
      - 'docs'
      - 'test'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
exclude-labels:
  - 'skip-changelog'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'chore'
      - 'refactor'
      - 'ci'
      - 'docs'
      - 'test'
  default: patch

# Matches this repo's actual PR title convention (Conventional Commits, e.g.
# "fix: ...", "ci: ...", "refactor(installer)!: ...").
#
# Deliberately no rule here for 'major'/'breaking': autolabeling those from a
# title or body text pattern (even a narrow one like Conventional Commits'
# "!:" marker) lets a major version bump - which downstream feeds
# version-resolver below - fire without a human ever deciding it should. This
# is exactly the failure mode that hit color-grading-skill: a PR whose body
# happened to mention "BREAKING CHANGE" as prose (describing a bug, not
# announcing one) got auto-labeled and would have shipped an unintended
# vX.0.0 if merged while that label stuck. major/breaking labels are applied
# by a human only, and version-resolver below still honors them when they
# are.
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\(.+\))?:/i'
    files:
      - '.github/workflows/**'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?:/i'
    files:
      - '**/*.md'
  - label: 'test'
    title:
      - '/^test(\(.+\))?:/i'
    files:
      - 'tests/**'

template: |
  ## What's Changed

  $CHANGES
